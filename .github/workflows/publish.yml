# Rebuilds the phone app (data + models + today's projections) and publishes it to GitHub Pages.
# One-time setup: repo Settings -> Pages -> Build and deployment -> Source: "GitHub Actions".
name: Publish app

on:
  schedule:
    # Hourly, plus every 20 minutes from 15:00 to 02:59 UTC (11am-10:59pm US Eastern).
    # GitHub runs these late or skips them, so the "next" job below also chains runs
    # every 20 minutes through the game-day window; the schedule restarts the chain.
    - cron: "7 * * * *"
    - cron: "27,47 15-23,0-2 * * *"
  workflow_dispatch: # "Run workflow" button in the Actions tab
    inputs:
      force:
        description: "Build even with no games yesterday, today or tomorrow"
        type: boolean
        default: false
  push:
    # Only the deploy branch: pushes to team branches would otherwise queue in the
    # "pages" group below and cancel a pending deploy.
    branches: [claude/stoic-davinci-v4p6k9]
    paths: ["baseball_stats/**", "web/**", "requirements.txt", ".github/workflows/publish.yml"]

permissions:
  contents: write # data-snapshot branch

  pages: write
  id-token: write

# Queue rather than cancel: the very first run backfills two seasons and takes a while.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # Off-season and off days: skip the build (and the 20-minute chain) unless there's a game
  # yesterday (to grade it), today or tomorrow (US Eastern dates). Pushes and forced manual
  # runs always build. If the MLB schedule can't be reached, build anyway. The hourly
  # schedule keeps checking, so the chain restarts by itself the day before games resume.
  gate:
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.check.outputs.run }}
    steps:
      - id: check
        env:
          EVENT: ${{ github.event_name }}
          FORCE: ${{ inputs.force }}
        run: |
          if [ "$EVENT" = push ] || [ "$FORCE" = true ]; then echo "run=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          from=$(TZ=America/New_York date -d yesterday +%F)
          to=$(TZ=America/New_York date -d tomorrow +%F)
          n=$(curl -fsS --max-time 30 "https://statsapi.mlb.com/api/v1/schedule?sportId=1&startDate=$from&endDate=$to&gameType=R,F,D,L,W" | jq '.totalGames // 0') || n=1
          echo "$n MLB games from $from to $to"
          if [ "${n:-1}" -gt 0 ]; then echo "run=true" >> "$GITHUB_OUTPUT"; else echo "run=false" >> "$GITHUB_OUTPUT"; fi

  build:
    needs: gate
    # Pushes only publish from the default branch (schedules always run there).
    if: needs.gate.outputs.run == 'true' && (github.event_name != 'push' || github.ref_name == github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      # Finished games never change: keep the processed tables between runs so each run
      # only downloads games played since the last one. Saved even when a run fails, so
      # an interrupted first backfill keeps the months it finished.
      - uses: actions/cache/restore@v4
        with:
          path: data/processed
          key: processed-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: processed-

      # The DraftKings price log can't be re-downloaded, so it also lives on the odds-log
      # branch: if the cache came back without it, start from that copy.
      - name: Restore price log
        run: |
          mkdir -p data/processed
          if [ ! -f data/processed/prop_snapshots.parquet ] && git fetch -q --depth=1 origin odds-log 2>/dev/null; then
            git show FETCH_HEAD:prop_snapshots.parquet > data/processed/prop_snapshots.parquet && echo "restored price log from odds-log"
          fi
          sha256sum data/processed/prop_snapshots.parquet 2>/dev/null > /tmp/log-before || true

      - name: Build site
        env:
          BASEBALL_REQUEST_DELAY: "0.1"
          # DraftKings props via the-odds-api.com; empty if the secret isn't set yet.
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          # Day of the month the free allowance resets; learned automatically once
          # the balance goes back up.
          ODDS_API_RESET_DAY: "5"
          # Optional max credits per month for this app (repository variable
          # ODDS_API_MONTHLY_CAP); 0 or unset = no cap. On the 20k plan the refresh rules,
          # not credits, are the limit: about 7k a month in season.
          ODDS_API_MONTHLY_CAP: ${{ vars.ODDS_API_MONTHLY_CAP || '0' }}
          # Strikeout model in the app, and one logged beside it in shadow for the price
          # log's market check (docs/gate_phase1_pitcher.md). Override with repository
          # variables: current | pa_simple | pa_seq (shadow may be empty).
          BASEBALL_MODEL_PITCHER: ${{ vars.BASEBALL_MODEL_PITCHER || 'pa_simple' }}
          BASEBALL_SHADOW_PITCHER: ${{ vars.BASEBALL_SHADOW_PITCHER || 'pa_seq' }}
          # Hitters: the multiclass distribution model passed the gate (docs/hitters_dist.md);
          # the whole-game simulation did not (docs/gate_phase2_batter.md) and runs in
          # shadow. current | dist | pa_sim.
          BASEBALL_MODEL_BATTER: ${{ vars.BASEBALL_MODEL_BATTER || 'dist' }}
          BASEBALL_SHADOW_BATTER: ${{ vars.BASEBALL_SHADOW_BATTER || 'pa_sim' }}
        run: |
          pip install -r requirements.txt
          python -m baseball_stats publish --out _site --statcast

      - uses: actions/cache/save@v4
        if: always()
        with:
          path: data/processed
          key: processed-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Push price log to the odds-log branch
        if: success()
        continue-on-error: true
        run: |
          f=data/processed/prop_snapshots.parquet
          [ -f "$f" ] || exit 0
          sha256sum "$f" | cmp -s - /tmp/log-before && { echo "price log unchanged"; exit 0; }
          dir=$(mktemp -d)
          cp "$f" "$dir/"
          cd "$dir"
          git init -q -b odds-log
          git add prop_snapshots.parquet
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -q -m "DraftKings price log $(date -u +%Y-%m-%dT%H:%MZ)"
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" odds-log

      # A copy of the processed tables for model development (manual runs + once a day).
      # One commit, force-pushed, so the branch never grows.
      - name: Snapshot processed data to the data-snapshot branch
        if: success()
        continue-on-error: true
        run: |
          if [ "$GITHUB_EVENT_NAME" != workflow_dispatch ] && [ "$(date -u +%H)" != 10 ]; then exit 0; fi
          snap=$(mktemp -d)
          mkdir "$snap/processed"
          cp data/processed/*.parquet "$snap/processed/"
          cd "$snap"
          git init -q -b data-snapshot
          git add processed
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -q -m "Processed data snapshot $(date -u +%Y-%m-%dT%H:%MZ)"
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" data-snapshot

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  # GitHub starts frequent schedules late or skips them (in practice about every 2 hours),
  # which is too slow for re-pricing props every 30 minutes before first pitch. So during
  # the game-day window each run queues the next one itself, 20 minutes after it started.
  # The schedule above restarts the chain if it ever breaks.
  next:
    needs: [gate, deploy]
    if: always() && github.event_name != 'push' && needs.gate.outputs.run == 'true'
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: read
    steps:
      - name: Queue the next run
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          REF: ${{ github.ref_name }}
        run: |
          # Window: 10:00-03:59 UTC (6am-11:59pm US Eastern).
          hour=$(date -u +%-H)
          if [ "$hour" -ge 4 ] && [ "$hour" -lt 10 ]; then echo "outside the game-day window"; exit 0; fi
          started=$(gh run view "$RUN_ID" --repo "$REPO" --json startedAt --jq .startedAt)
          wait=$(( 1200 - ( $(date -u +%s) - $(date -u -d "$started" +%s) ) ))
          if [ "$wait" -gt 0 ]; then sleep "$wait"; fi
          others=$(gh run list --repo "$REPO" --workflow publish.yml --limit 20 \
            --json databaseId,status --jq "[.[] | select(.databaseId != $RUN_ID and (.status == \"queued\" or .status == \"in_progress\" or .status == \"waiting\" or .status == \"pending\" or .status == \"requested\"))] | length")
          if [ "$others" -gt 0 ]; then echo "another run is already queued or running"; exit 0; fi
          gh workflow run publish.yml --repo "$REPO" --ref "$REF"
          echo "queued the next run"
