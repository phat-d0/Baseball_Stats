# Rebuilds the phone app (data + models + today's projections) and publishes it to GitHub Pages.
# One-time setup: repo Settings -> Pages -> Build and deployment -> Source: "GitHub Actions".
name: Publish app

on:
  schedule:
    # Every hour, plus every 20 minutes from 15:00 to 02:59 UTC (11am-10:59pm US Eastern),
    # when probable starters change, lineups get posted and props are re-priced every
    # 30 minutes before first pitch. GitHub may start scheduled runs a few minutes late.
    - cron: "7 * * * *"
    - cron: "27,47 15-23,0-2 * * *"
  workflow_dispatch: # "Run workflow" button in the Actions tab
  push:
    paths: ["baseball_stats/**", "web/**", "requirements.txt", ".github/workflows/publish.yml"]

permissions:
  contents: write # data-snapshot branch

  pages: write
  id-token: write

# Queue rather than cancel: the very first run backfills two seasons and takes a while.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    # Pushes only publish from the default branch (schedules always run there).
    if: github.event_name != 'push' || github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      # Finished games never change: keep the processed tables between runs so each run
      # only downloads games played since the last one. Saved even when a run fails, so
      # an interrupted first backfill keeps the months it finished.
      - uses: actions/cache/restore@v4
        with:
          path: data/processed
          key: processed-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: processed-

      # The DraftKings price log can't be re-downloaded, so it also lives on the odds-log
      # branch: if the cache came back without it, start from that copy.
      - name: Restore price log
        run: |
          mkdir -p data/processed
          if [ ! -f data/processed/prop_snapshots.parquet ] && git fetch -q --depth=1 origin odds-log 2>/dev/null; then
            git show FETCH_HEAD:prop_snapshots.parquet > data/processed/prop_snapshots.parquet && echo "restored price log from odds-log"
          fi
          sha256sum data/processed/prop_snapshots.parquet 2>/dev/null > /tmp/log-before || true

      - name: Build site
        env:
          BASEBALL_REQUEST_DELAY: "0.1"
          # DraftKings props via the-odds-api.com; empty if the secret isn't set yet.
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          # Day of the month the free allowance resets; learned automatically once
          # the balance goes back up.
          ODDS_API_RESET_DAY: "5"
          # Optional max credits per month for this app (repository variable
          # ODDS_API_MONTHLY_CAP); 0 or unset = no cap. On the 20k plan the refresh rules,
          # not credits, are the limit: about 7k a month in season.
          ODDS_API_MONTHLY_CAP: ${{ vars.ODDS_API_MONTHLY_CAP || '0' }}
        run: |
          pip install -r requirements.txt
          python -m baseball_stats publish --out _site --statcast

      - uses: actions/cache/save@v4
        if: always()
        with:
          path: data/processed
          key: processed-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Push price log to the odds-log branch
        if: success()
        continue-on-error: true
        run: |
          f=data/processed/prop_snapshots.parquet
          [ -f "$f" ] || exit 0
          sha256sum "$f" | cmp -s - /tmp/log-before && { echo "price log unchanged"; exit 0; }
          dir=$(mktemp -d)
          cp "$f" "$dir/"
          cd "$dir"
          git init -q -b odds-log
          git add prop_snapshots.parquet
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -q -m "DraftKings price log $(date -u +%Y-%m-%dT%H:%MZ)"
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" odds-log

      # A copy of the processed tables for model development (manual runs + once a day).
      # One commit, force-pushed, so the branch never grows.
      - name: Snapshot processed data to the data-snapshot branch
        if: success()
        continue-on-error: true
        run: |
          if [ "$GITHUB_EVENT_NAME" != workflow_dispatch ] && [ "$(date -u +%H)" != 10 ]; then exit 0; fi
          snap=$(mktemp -d)
          mkdir "$snap/processed"
          cp data/processed/*.parquet "$snap/processed/"
          cd "$snap"
          git init -q -b data-snapshot
          git add processed
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -q -m "Processed data snapshot $(date -u +%Y-%m-%dT%H:%MZ)"
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" data-snapshot

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
