<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>MLB Model</title>
  <meta name="description" content="Projected Hits+Runs+RBIs for batters and strikeouts for starting pitchers">
  <meta name="theme-color" content="#fcfcfb" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#1a1a19" media="(prefers-color-scheme: dark)">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="MLB Model">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="topbar">
    <div>
      <h1 id="title">MLB Model</h1>
      <p id="updated" class="muted">Loading…</p>
    </div>
    <button id="refresh" class="icon-btn" aria-label="Refresh">
      <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" d="M20 12a8 8 0 1 1-2.34-5.66M20 4v5h-5"/></svg>
    </button>
  </header>

  <main id="view" tabindex="-1"></main>

  <nav class="tabbar" aria-label="Sections">
    <button data-tab="games" class="active">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3l9 9-9 9-9-9z"/><path d="M12 8.5l3.5 3.5-3.5 3.5-3.5-3.5z"/></svg>
      <span>Games</span>
    </button>
    <button data-tab="hitters">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4.5 19.5l2-2M7 17l11.5-11.5a2.1 2.1 0 0 1 3 3L10 20"/><circle cx="5.5" cy="7" r="2.2"/></svg>
      <span>Hitters</span>
    </button>
    <button data-tab="pitchers">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8.5"/><path d="M7.5 5.2c1.8 2.1 2.1 4.6 1.6 6.8M16.5 18.8c-1.8-2.1-2.1-4.6-1.6-6.8"/></svg>
      <span>Pitchers</span>
    </button>
    <button data-tab="record">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 17l5-5 4 3 8-8M15 7h5v5"/></svg>
      <span>Record</span>
    </button>
  </nav>

  <div id="sheet" class="sheet" role="dialog" aria-modal="true" aria-labelledby="sheet-title" hidden>
    <div class="sheet-backdrop" data-close></div>
    <div class="sheet-panel">
      <div class="sheet-grip" data-close></div>
      <button class="sheet-close icon-btn" data-close aria-label="Close">
        <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path stroke="currentColor" stroke-width="2" stroke-linecap="round" d="M6 6l12 12M18 6L6 18"/></svg>
      </button>
      <div id="sheet-body"></div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
